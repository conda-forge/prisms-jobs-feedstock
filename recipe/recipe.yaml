schema_version: 1

context:
  name: prisms-jobs
  version: "4.0.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/prisms-center/prisms_jobs/archive/v${{ version }}.tar.gz
  sha256: 334a69b974eae27862f25080d7e5d22e94f2140a634cc6783b2d4134e2074f02

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pstat=prisms_jobs.scripts.pstat:main
      - psub=prisms_jobs.scripts.psub:main
      - taskmaster=prisms_jobs.scripts.taskmaster:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - six
  run:
    - python >=${{ python_min }},<3.12
    - future
    - six

tests:
  - python:
      imports:
        - prisms_jobs
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pstat --help
      - psub --help
      - taskmaster --help

about:
  summary: A Python package and set of scripts used for submitting and managing cluster jobs via PBS (TORQUE) or Slurm.
  license: LGPL-2.1-or-later
  license_file: LICENSE
  homepage: https://prisms-center.github.io/prisms_jobs_docs/

extra:
  recipe-maintainers:
    - jan-janssen
